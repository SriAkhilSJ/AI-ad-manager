name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI runs entirely offline: no provider keys, no platform credentials, no
  # vault key. Every integration must therefore report `unavailable`, and the
  # suite is written to assert exactly that.
  ENVIRONMENT: test
  SECRET_KEY: ci-only-secret-key-0123456789abcdef0123456789abcdef
  DATABASE_URL: sqlite+aiosqlite:///./.data/ci.db
  BOOTSTRAP_FOUNDER_EMAIL: founder@example.com
  BOOTSTRAP_FOUNDER_PASSWORD: founder-ci-password
  TASK_DISPATCHER: inline
  STORAGE_BACKEND: local
  FLOW_LIVE_GENERATION_ENABLED: "false"
  CREATIVE_ALLOW_PAID_GENERATION: "false"
  TOKEN_VAULT_BACKEND: none
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  backend:
    name: backend — tests, migrations, audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Alembic upgrade / downgrade / upgrade
        working-directory: backend
        env:
          DATABASE_URL: sqlite+aiosqlite:///./.data/ci-migrations.db
        run: |
          mkdir -p .data
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head
          alembic current

      - name: Full test suite
        working-directory: backend
        run: pytest tests -p no:warnings

      - name: Source audit must stay blocked
        working-directory: backend
        # Exit 3 / SOURCE_ABSENT is the *expected* result: the DeepX source is not
        # in this repository and must never be vendored. Any other exit code means
        # the gate changed and needs a human.
        run: |
          set +e
          python ../scripts/flow_source_audit.py > audit.txt 2>&1
          code=$?
          cat audit.txt
          test "$code" -eq 3 || { echo "audit exit code changed: $code"; exit 1; }
          grep -q "SOURCE_ABSENT" audit.txt

  backend-postgres:
    name: backend — PostgreSQL 16 + pgvector + Redis (production dialect)
    runs-on: ubuntu-latest
    # The SQLite job above is the fast smoke suite. This job is the point of
    # Phase 4.2: the same suite on the databases production actually runs, so a
    # defect that SQLite masks (type mismatches, FK/CHAR widths, extension
    # requirements, cross-loop pooling) fails here instead of at launch.
    timeout-minutes: 45
    permissions:
      contents: write   # only so a failed run can post its own diagnostics
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crusor_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d crusor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-only-secret-key-0123456789abcdef0123456789abcdef
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/crusor_test
      CRUSOR_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/crusor_test
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
      TASK_DISPATCHER: celery
      STORAGE_BACKEND: local
      FLOW_LIVE_GENERATION_ENABLED: "false"
      CREATIVE_ALLOW_PAID_GENERATION: "false"
      TOKEN_VAULT_BACKEND: none
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Dependency sanity (pip check + the broker stack)
        working-directory: backend
        # redis-py drove kombu's transport through an incompatible release before;
        # `pip check` does not catch that (the metadata claims are satisfied), so
        # the resolved versions are printed next to the real round-trip below.
        run: |
          pip check
          python - <<'PY'
          import celery, kombu, redis
          print(f"celery {celery.__version__} | kombu {kombu.__version__} | redis-py {redis.__version__}")
          PY

      - name: Wait for PostgreSQL
        working-directory: backend
        run: |
          python - <<'PY'
          import asyncio, os, time
          import asyncpg
          dsn = os.environ["DATABASE_URL"].replace("postgresql+asyncpg://", "postgresql://")
          for attempt in range(60):
              try:
                  async def check():
                      conn = await asyncpg.connect(dsn, timeout=5)
                      try:
                          await conn.execute("CREATE EXTENSION IF NOT EXISTS vector")
                          version = await conn.fetchval(
                              "SELECT extversion FROM pg_extension WHERE extname='vector'")
                          assert version, "pgvector extension is missing"
                          print(f"postgres ready, vector {version}")
                      finally:
                          await conn.close()
                  asyncio.run(check())
                  break
              except Exception as exc:
                  if attempt == 59:
                      raise
                  print(f"waiting for postgres: {exc}")
                  time.sleep(2)
          PY

      - name: Alembic upgrade / downgrade / upgrade on PostgreSQL
        working-directory: backend
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head
          alembic current

      - name: Full suite on PostgreSQL (parallel)
        working-directory: backend
        run: pytest tests -q -n 4 -p no:randomly

      - name: Wait for Redis
        working-directory: backend
        # The container health check is not proof the client library can talk to
        # it; this is. It fails the job here rather than inside the round trip.
        run: |
          python - <<'PY'
          import os, time, redis
          url = os.environ["REDIS_URL"]
          for attempt in range(30):
              try:
                  client = redis.Redis.from_url(url, socket_connect_timeout=5, socket_timeout=5)
                  server = client.info("server")
                  print(f"redis reachable via redis-py {redis.__version__}: "
                        f"server {server.get('redis_version')} on {url}")
                  break
              except Exception as exc:
                  if attempt == 29:
                      raise
                  print(f"waiting for redis: {type(exc).__name__}: {exc}")
                  time.sleep(2)
          PY

      - name: Start a Celery worker
        working-directory: backend
        # A unique node name: two workers sharing `celery@hostname` make
        # `inspect()` answer from whichever registers last, which is how a stale
        # worker can make a correct dispatch look broken.
        run: |
          celery -A app.tasks.celery_app:celery_app worker --pool=solo --loglevel=info \
            -n "crusor-ci@%h" --detach --pidfile=/tmp/celery.pid --logfile=/tmp/celery.log
          for i in $(seq 1 30); do
            grep -q "ready" /tmp/celery.log && break
            sleep 2
          done
          cat /tmp/celery.log
          grep -q "ready" /tmp/celery.log || { echo "::error::the worker never reported ready"; exit 1; }

      - name: Broker round trip (dispatch → worker → result)
        working-directory: backend
        # `tee` so the diagnostics step below can quote the client-side failure;
        # pipefail keeps the step's exit status meaningful.
        run: |
          set -o pipefail
          python ../scripts/celery_roundtrip.py 2>&1 | tee /tmp/roundtrip.log

      - name: Publish broker diagnostics on failure
        if: failure()
        working-directory: backend
        # Actions logs are downloadable only from a storage host, so a failure in
        # this job is otherwise invisible to anyone reading the run through the
        # API. This posts the tails as a commit comment (no secrets: the script
        # redacts broker URLs and the app redacts log fields).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### CI broker job failed — diagnostics"
            echo '```'
            echo "celery/kombu/redis: $(python -c 'import celery,kombu,redis;print(celery.__version__,kombu.__version__,redis.__version__)' 2>&1)"
            echo "--- round trip output ---"
            tail -80 /tmp/roundtrip.log 2>&1 || true
            echo "--- worker log: first exception ---"
            grep -nE "Error|Exception|Traceback|asyncpg|attached to a different loop" /tmp/celery.log 2>/dev/null | head -30 || true
            echo "--- worker log (tail) ---"
            tail -120 /tmp/celery.log 2>&1 || true
            echo '```'
          } > /tmp/diag.md
          gh api --method POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$(cat /tmp/diag.md)" >/dev/null 2>&1 \
            || echo "could not post diagnostics (no permission); see the job log"


      - name: Stop the Celery worker
        if: always()
        working-directory: backend
        run: |
          if [ -f /tmp/celery.pid ]; then kill "$(cat /tmp/celery.pid)" || true; fi
          tail -50 /tmp/celery.log || true

  frontend:
    name: frontend — typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci || npm install
      - run: npx tsc --noEmit
      - run: npm run build

  no-secrets:
    name: guard — no credentials in source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed .env files and obvious key material
        run: |
          set -e
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::a .env file is committed"; exit 1
          fi
          if git grep -nE '(sk-[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|EAA[A-Za-z0-9]{40,})' -- . ':!*.md' ':!docs' ; then
            echo "::error::key-shaped string found in source"; exit 1
          fi
          echo "no credentials in source"
